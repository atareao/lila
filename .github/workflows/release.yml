name: Release

on:
  push:
    branches: [main]
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  tag:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
          token: ${{ secrets.GH_PAT }}
      - name: Create tag if missing
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          V=$(grep '^current_version' .vampus.yml | sed 's/.*: *//')
          if git rev-parse "v$V" >/dev/null 2>&1; then
            echo "tag v$V ya existe"
          else
            git tag "v$V"
            git push origin "v$V"
          fi

  build:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - name: Prepare container
        run: pacman -Syu --noconfirm --needed git nodejs
      - uses: actions/checkout@v4
      - name: Install dependencies
        run: pacman -S --noconfirm --needed rust pkgconf gtk4 gtk4-layer-shell
      - name: Build
        run: cargo build --release
      - name: Package
        run: tar czf lila-x86_64-unknown-linux-gnu.tar.gz -C target/release lila
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: lila
          path: lila-x86_64-unknown-linux-gnu.tar.gz

  release:
    needs: [build]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: lila
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          name: LiLa ${{ github.ref_name }}
          files: lila-x86_64-unknown-linux-gnu.tar.gz
          generate_release_notes: true
